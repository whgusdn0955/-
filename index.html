<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영어 단어장</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main>
    <h1>영어 단어장</h1>
    <p>나만의 영어 단어 암기 앱</p>

    <button id="addBundleBtn">+ 묶음 추가</button>

    <div id="bundleList"></div>
</main>

<script>
    <script>
    const addBundleBtn = document.getElementById("addBundleBtn");
    const bundleList = document.getElementById("bundleList");

    // 저장된 묶음 불러오기
    let bundles = JSON.parse(localStorage.getItem("bundles")) || [];

    // 화면에 묶음 표시
    function showBundles() {
        bundleList.innerHTML = "";

        bundles.forEach(function(bundle) {
            const bundleDiv = document.createElement("div");
            bundleDiv.textContent = bundle.name;
            bundleList.appendChild(bundleDiv);
        });
    }

    // 묶음 추가
    addBundleBtn.addEventListener("click", function() {
        const bundleName = prompt("묶음 이름을 입력하세요.");

        if (!bundleName || bundleName.trim() === "") {
            return;
        }

        bundles.push({
            name: bundleName.trim()
        });

        // 저장
        localStorage.setItem("bundles", JSON.stringify(bundles));

        // 화면 업데이트
        showBundles();
    });

    // 처음 실행할 때 저장된 묶음 표시
    showBundles();
</script>
</script>

</body>
</html>
