<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="단어 암기 앱">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>단어 암기장</title>
</head>
<body>
  <div id="app">

    <header class="topbar">
      <div class="topbar-left">
        <button id="backBtn" class="icon-btn hidden">←</button>
        <div class="logo">📚 단어 암기장</div>
      </div>

      <div class="topbar-right">
        <button id="themeBtn" class="nav-btn">🌙</button>
        <button id="homeBtn" class="nav-btn">🏠 홈</button>
        <button id="statsBtn" class="nav-btn">📊 통계</button>
        <button id="settingsBtn" class="nav-btn">⚙️ 설정</button>
      </div>
    </header>

    <main id="mainContent"></main>

  </div>

  <!-- 빠른 테스트 모달 -->
  <div id="quickModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3>⚡ 빠른 테스트</h3>
        <button id="closeQuickModal" class="icon-btn">✕</button>
      </div>

      <div class="quick-options">
        <button id="importantQuickBtn" class="quick-option">
          ⭐ 중요 단어 테스트
        </button>

        <button id="wrongQuickBtn" class="quick-option">
          ❌ 틀린 단어 테스트
        </button>
      </div>
    </div>
  </div>

  <!-- 입력 모달 -->
  <div id="inputModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="inputModalTitle">입력</h3>
        <button id="inputModalClose" class="icon-btn">✕</button>
      </div>

      <input
        id="inputModalField"
        class="modal-input"
        type="text"
        autocomplete="off"
      >

      <div class="modal-actions">
        <button id="inputModalCancel" class="secondary-btn">
          취소
        </button>

        <button id="inputModalConfirm" class="primary-btn">
          확인
        </button>
      </div>
    </div>
  </div>

  <!-- 확인 모달 -->
  <div id="confirmModal" class="modal hidden">
    <div class="modal-box small">
      <h3 id="confirmTitle">확인</h3>
      <p id="confirmMessage"></p>

      <div class="modal-actions">
        <button id="confirmCancelBtn" class="secondary-btn">
          취소
        </button>

        <button id="confirmOkBtn" class="primary-btn">
          확인
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
