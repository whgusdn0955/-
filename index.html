<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영어 단어장</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main>
    <h1>영어 단어장</h1>
    <p>나만의 영어 단어 암기 앱</p>

    <button id="addBundleBtn">+ 묶음 추가</button>

    <div id="bundleList"></div>
</main>

<script>
    const addBundleBtn = document.getElementById("addBundleBtn");
    const bundleList = document.getElementById("bundleList");

    addBundleBtn.addEventListener("click", function() {
        const bundleName = prompt("묶음 이름을 입력하세요.");

        if (!bundleName || bundleName.trim() === "") {
            return;
        }

        const bundle = document.createElement("div");
        bundle.textContent = bundleName;

        bundleList.appendChild(bundle);
    });
</script>

</body>
</html>
